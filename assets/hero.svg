<svg width="1200" height="440" viewBox="0 0 1200 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="440">
      <stop stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#101722"/>
    </linearGradient>
    <linearGradient id="blueLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2F81F7"/>
      <stop offset="1" stop-color="#58A6FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="438" rx="24" fill="url(#panel)" stroke="#263142"/>
  <rect x="42" y="42" width="6" height="356" rx="3" fill="url(#blueLine)"/>

  <text x="86" y="86" fill="#7D8A99" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2">SIKSDEV / PROFILE</text>
  <text x="86" y="162" fill="#F0F6FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="700">Renato Fernandes</text>
  <text x="86" y="208" fill="#9BA8B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Software Development Student</text>

  <text x="86" y="270" fill="#D4DCE7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">
    Moving deeper into C# / .NET and web development —
  </text>
  <text x="86" y="304" fill="#D4DCE7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">
    while shipping real RedM &amp; FiveM systems through SafeStudio.
  </text>

  <g transform="translate(86 350)">
    <circle cx="7" cy="7" r="7" fill="#2F81F7">
      <animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="14" fill="#8B98A8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
      Rio Grande do Sul, Brazil
    </text>
  </g>

  <g opacity="0.9">
    <circle cx="1008" cy="150" r="108" stroke="#233248" stroke-width="1.5"/>
    <circle cx="1008" cy="150" r="76" stroke="#1D2A3C" stroke-width="1.5"/>
    <circle cx="1008" cy="150" r="43" stroke="#2F81F7" stroke-width="2"/>
    <circle cx="1008" cy="150" r="7" fill="#58A6FF">
      <animate attributeName="r" values="7;10;7" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.55;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <path d="M865 150H1150M1008 7V293" stroke="#172334" stroke-width="1"/>
  </g>

  <g transform="translate(846 302)">
    <text x="0" y="0" fill="#6F7D8D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.5">CURRENT FOCUS</text>
    <text x="0" y="32" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">C#  ·  .NET  ·  WEB</text>
    <rect x="0" y="54" width="270" height="2" rx="1" fill="#1C2A3D"/>
    <rect x="0" y="54" width="92" height="2" rx="1" fill="#2F81F7">
      <animate attributeName="width" values="72;112;72" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
