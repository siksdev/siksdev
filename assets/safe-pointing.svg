<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
    </style>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#58A6FF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="520" fill="#0D1117"/>

  <text x="66" y="55" fill="#5E6C7C" font-size="13" class="mono" letter-spacing="2">SELECTED WORK / 001</text>
  <text x="66" y="120" fill="#F0F6FC" font-size="52" font-weight="800" class="sans">SAFE POINTING</text>
  <text x="66" y="154" fill="#58A6FF" font-size="18" font-weight="650" class="sans">Standalone pointing system for RedM</text>

  <text x="66" y="220" fill="#C9D1D9" font-size="19" class="sans">
    Camera-driven raycasting makes the character point exactly
  </text>
  <text x="66" y="250" fill="#C9D1D9" font-size="19" class="sans">
    where the player is looking — synchronized for everyone.
  </text>

  <g class="mono" font-size="14">
    <text x="66" y="318" fill="#637183" letter-spacing="1.4">ARCHITECTURE</text>
    <text x="66" y="345" fill="#E6EDF3">standalone / framework-independent</text>

    <text x="66" y="392" fill="#637183" letter-spacing="1.4">CORE</text>
    <text x="66" y="419" fill="#E6EDF3">camera raycast / network events / Lua 5.4</text>

    <text x="66" y="466" fill="#637183" letter-spacing="1.4">GOAL</text>
    <text x="66" y="493" fill="#E6EDF3">natural interaction with low CPU footprint</text>
  </g>

  <!-- Schematic -->
  <g transform="translate(690,65)">
    <text x="0" y="0" fill="#5E6C7C" font-size="12" class="mono" letter-spacing="1.8">RAYCAST / NETWORK SCHEMATIC</text>
    <rect x="0" y="34" width="444" height="406" fill="#0B0F14" stroke="#263142"/>

    <!-- camera -->
    <rect x="54" y="180" width="74" height="46" fill="none" stroke="#7C8998" stroke-width="2"/>
    <path d="M128 190 L155 177 V229 L128 216 Z" fill="none" stroke="#7C8998" stroke-width="2"/>
    <text x="54" y="250" fill="#637183" font-size="12" class="mono">CAMERA</text>

    <!-- player -->
    <circle cx="90" cy="120" r="20" fill="none" stroke="#7C8998" stroke-width="2"/>
    <path d="M90 140 V172 M70 156 H110" stroke="#7C8998" stroke-width="2" stroke-linecap="round"/>

    <!-- ray -->
    <line x1="155" y1="203" x2="342" y2="203" stroke="#2F81F7" stroke-width="3" stroke-dasharray="9 8">
      <animate attributeName="stroke-dashoffset" values="0;-34" dur="1.5s" repeatCount="indefinite"/>
    </line>

    <!-- target -->
    <circle cx="350" cy="203" r="56" stroke="#233248" stroke-width="2" fill="none"/>
    <circle cx="350" cy="203" r="31" stroke="#2F81F7" stroke-width="2" fill="none"/>
    <circle cx="350" cy="203" r="8" fill="#58A6FF"/>
    <circle cx="350" cy="203" r="24" fill="url(#pulse)">
      <animate attributeName="r" values="18;42;18" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;.2;.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="324" y="286" fill="#637183" font-size="12" class="mono">TARGET</text>

    <!-- sync nodes -->
    <line x1="185" y1="336" x2="350" y2="336" stroke="#344152" stroke-width="2"/>
    <circle cx="185" cy="336" r="8" fill="#A7B2BF"/>
    <circle cx="268" cy="336" r="8" fill="#A7B2BF"/>
    <circle cx="350" cy="336" r="8" fill="#A7B2BF"/>
    <circle r="5" fill="#58A6FF">
      <animateMotion path="M185 336 H350" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="185" y="374" fill="#637183" font-size="12" class="mono">CLIENT</text>
    <text x="250" y="374" fill="#637183" font-size="12" class="mono">SYNC</text>
    <text x="328" y="374" fill="#637183" font-size="12" class="mono">PEERS</text>
  </g>
</svg>
