<svg width="1000" height="360" viewBox="0 0 1000 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Safe Pointing featured project</title>
  <desc id="desc">Featured open-source RedM project by Renato Fernandes and SafeStudio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="radar" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(789 182) rotate(90) scale(150)">
      <stop stop-color="#1F6FEB" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="998" height="358" rx="20" fill="url(#bg)" stroke="#30363D"/>
  <rect x="38" y="34" width="128" height="28" rx="14" fill="#132238" stroke="#1F6FEB" stroke-opacity="0.55"/>
  <text x="102" y="53" text-anchor="middle" fill="#79C0FF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.1">OPEN SOURCE</text>
  <text x="40" y="104" fill="#F0F6FC" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Safe Pointing</text>
  <text x="40" y="137" fill="#8B949E" font-family="Arial, Helvetica, sans-serif" font-size="15">Standalone pointing system for RedM focused on precision, sync and low overhead.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="0.6">
    <rect x="40" y="173" width="118" height="34" rx="17" fill="#161B22" stroke="#30363D"/><text x="99" y="195" text-anchor="middle" fill="#C9D1D9">STANDALONE</text>
    <rect x="170" y="173" width="116" height="34" rx="17" fill="#161B22" stroke="#30363D"/><text x="228" y="195" text-anchor="middle" fill="#C9D1D9">RAYCASTING</text>
    <rect x="298" y="173" width="136" height="34" rx="17" fill="#161B22" stroke="#30363D"/><text x="366" y="195" text-anchor="middle" fill="#C9D1D9">NETWORK SYNC</text>
    <rect x="446" y="173" width="92" height="34" rx="17" fill="#161B22" stroke="#30363D"/><text x="492" y="195" text-anchor="middle" fill="#C9D1D9">LUA 5.4</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="47" cy="241" r="4" fill="#3FB950"/>
    <text x="61" y="246" fill="#C9D1D9" font-size="14">Framework independent</text>
    <circle cx="47" cy="274" r="4" fill="#58A6FF"/>
    <text x="61" y="279" fill="#C9D1D9" font-size="14">Camera-direction raycasting</text>
    <circle cx="270" cy="241" r="4" fill="#A371F7"/>
    <text x="284" y="246" fill="#C9D1D9" font-size="14">Optimized network events</text>
    <circle cx="270" cy="274" r="4" fill="#F2CC60"/>
    <text x="284" y="279" fill="#C9D1D9" font-size="14">Low CPU / Resmon footprint</text>
  </g>

  <rect x="40" y="310" width="268" height="1" fill="#30363D"/>
  <text x="40" y="335" fill="#58A6FF" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">github.com/siksdev/Safe-Pointing →</text>

  <g>
    <circle cx="792" cy="183" r="136" fill="url(#radar)"/>
    <circle cx="792" cy="183" r="102" stroke="#30363D"/>
    <circle cx="792" cy="183" r="69" stroke="#30363D" stroke-dasharray="5 7"/>
    <circle cx="792" cy="183" r="35" stroke="#1F6FEB" stroke-opacity="0.45"/>
    <path d="M656 183H928M792 47V319" stroke="#30363D" stroke-opacity="0.72"/>
    <path d="M792 183L899 112" stroke="#58A6FF" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="899" cy="112" r="7" fill="#58A6FF">
      <animate attributeName="r" values="5;9;5" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="792" cy="183" r="6" fill="#F0F6FC"/>
    <path d="M792 183L899 112" stroke="#58A6FF" stroke-width="9" stroke-linecap="round" opacity="0.08"/>
    <circle r="4" fill="#FFFFFF">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M792 183 L899 112 L792 183"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <text x="792" y="337" text-anchor="middle" fill="#484F58" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.3">CAMERA → WORLD RAY</text>
  </g>
</svg>
