<svg width="1000" height="330" viewBox="0 0 1000 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Technologies Renato works with</title>
  <desc id="desc">A dark professional technology orbit featuring Lua, C sharp, Git, GitHub, HTML, CSS, JavaScript, TypeScript, React, Tailwind and MariaDB.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1000" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(500 182) rotate(90) scale(86)">
      <stop stop-color="#1F6FEB" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="998" height="328" rx="20" fill="url(#panel)" stroke="#30363D"/>
  <text x="40" y="48" fill="#F0F6FC" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Technologies I work with</text>
  <text x="40" y="72" fill="#8B949E" font-family="Arial, Helvetica, sans-serif" font-size="13">A practical stack shaped by web projects, game systems and continuous learning.</text>

  <ellipse cx="500" cy="190" rx="335" ry="93" stroke="#30363D" stroke-width="1.4" stroke-dasharray="7 11">
    <animate attributeName="stroke-dashoffset" values="0;-72" dur="16s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="500" cy="190" rx="225" ry="62" stroke="#1F6FEB" stroke-opacity="0.24" stroke-width="1" stroke-dasharray="3 10">
    <animate attributeName="stroke-dashoffset" values="0;52" dur="13s" repeatCount="indefinite"/>
  </ellipse>

  <circle cx="500" cy="190" r="73" fill="url(#core)"/>
  <circle cx="500" cy="190" r="47" fill="#111820" stroke="#2F81F7" stroke-opacity="0.75"/>
  <circle cx="500" cy="190" r="4" fill="#58A6FF">
    <animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;1;0.55" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <text x="500" y="184" text-anchor="middle" fill="#F0F6FC" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.7">CURRENT</text>
  <text x="500" y="204" text-anchor="middle" fill="#58A6FF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">STACK</text>

